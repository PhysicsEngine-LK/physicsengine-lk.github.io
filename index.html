<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Engine</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --p:#6c5ce7; --ink:#1e1633; --mut:#5b5675; --bg:#f6f4fb; --card:#fff; --line:#e4dcff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ece8f6; --mut:#a59cbf; --bg:#0f0b1a; --card:#1a1428; --line:#3a3052; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width:760px; margin:32px auto; padding:28px 24px; background:var(--card); border-radius:16px; border-top:6px solid var(--p); }
  h1 { margin:0 0 4px; } .mut { color:var(--mut); margin:0 0 20px; }
  .links { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .links a { display:block; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; color:var(--ink); text-decoration:none; font-weight:600; }
  .links a:hover { border-color:var(--p); }
  .links small { display:block; font-weight:400; color:var(--mut); }
  footer { margin-top:24px; font-size:14px; color:var(--mut); }
  footer a { color:var(--p); }
  @media (max-width:600px) { main { margin:0; border-radius:0; padding:20px 16px; } }
</style>
</head>
<body>
<main>
  <h1>Physics Engine</h1>
  <p class="mut">A/L Physics · Sri Lanka</p>
  <div class="links">
    <a href="https://physicsengine-lk.github.io/physics-engine-simulations/simulations/">🧪 Simulations<small>Interactive physics simulations</small></a>
    <a href="https://physicsengine-lk.github.io/physics-engine-simulations/quizes/">📝 Quizzes<small>Daily quizzes</small></a>
    <a href="privacy.html">🔒 Privacy Policy<small>How we handle data</small></a>
  </div>
  <footer>Contact: <a href="mailto:physicsengine.official@gmail.com">physicsengine.official@gmail.com</a> · 074 3 123 467</footer>
</main>
</body>
</html>
